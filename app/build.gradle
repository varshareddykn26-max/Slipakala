plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
    // id 'com.google.gms.google-services' // Commented out due to invalid google-services.json
}

android {
    namespace 'com.shilpakala.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shilpakala.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

}

dependencies {
    // Kotlin & Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.10.0"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.6.1"

    // Jetpack Compose
    implementation "androidx.compose.ui:ui:1.5.0"
    implementation "androidx.compose.material:material:1.5.0"
    implementation "androidx.compose.material3:material3:1.1.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.0"
    debugImplementation "androidx.compose.ui:ui-tooling:1.5.0"
    implementation "androidx.activity:activity-compose:1.7.2"

    // CameraX
    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.7.0"

    // Permissions
    implementation "com.google.accompanist:accompanist-permissions:0.33.1-alpha"

    // Image loading
    implementation "io.coil-kt:coil-compose:2.4.0"

    // Room Database
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    kapt "androidx.room:room-compiler:2.8.4"

    // Retrofit & OkHttp (for API calls)
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // QR Code generation
    implementation "com.google.zxing:core:3.5.3"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    // PDF generation
    implementation "com.itextpdf:itextpdf:5.5.13.3"

    // Firebase Cloud Storage
    implementation "com.google.firebase:firebase-storage-ktx:20.3.0"
    implementation "com.google.firebase:firebase-auth-ktx:22.3.1"
    implementation "com.google.firebase:firebase-firestore-ktx:24.11.1"

    // Payment Gateway (Razorpay)
    implementation "com.razorpay:checkout:1.6.33"

    // WorkManager for background tasks
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // DataStore for preferences
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Serialization
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"

    // WhatsApp Integration
    implementation "com.google.android.gms:play-services-awareness:20.0.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.5.0"
}
